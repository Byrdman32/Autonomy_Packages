description = "OpenCV without CUDA, GUI or FFmpeg (shared)"
version = "5.0.0"
revision = 1
source = "https://github.com/opencv/opencv.git"
tag = "{version}"
# OpenCV picks up Eigen when it's installed, as it did in the image.
depends = ["eigen"]
apt = ["libjpeg-dev", "libpng-dev", "libtiff-dev", "libwebp-dev", "zlib1g-dev", "libv4l-dev"]
cmake_args = [
    "-DWITH_CUDA=OFF", "-DWITH_FFMPEG=OFF", "-DWITH_GTK=OFF", "-DWITH_QT=OFF", "-DWITH_V4L=ON",
    "-DBUILD_TESTS=OFF", "-DBUILD_PERF_TESTS=OFF", "-DBUILD_EXAMPLES=OFF", "-DBUILD_opencv_apps=OFF",
    "-DBUILD_opencv_python3=OFF", "-DBUILD_JAVA=OFF", "-DOPENCV_GENERATE_PKGCONFIG=ON",
]
