name: packages

on:
  pull_request:
    branches: [develop]

  push:
    branches: [develop]

  workflow_dispatch:

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RELEASE_TAG: apt
  REPO_URL: https://github.com/${{ github.repository }}/releases/download/apt

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tests and ruff
        run: |
          pipx run --spec pytest==9.1.1 pytest -q -p no:cacheprovider tests
          pipx run --spec ruff==0.16.9 ruff check .
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Job summary
        if: always()
        run: |
          {
            echo "### 🧹 lint"
            echo
            echo "Recipe and packaging tests, ruff and actionlint: **${{ job.status }}**."
          } >> "${GITHUB_STEP_SUMMARY}"

  plan:
    name: plan
    needs: lint
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7

      - name: Download the published index
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            curl -fsSL --retry 5 --retry-all-errors -o Packages "${REPO_URL}/Packages"
          else
            echo "Nothing published yet."
            : > Packages
          fi

      - id: plan
        name: Plan
        run: |
          python3 tools/packages.py matrix --index Packages > matrix.json
          echo "matrix=$(cat matrix.json)" >> "${GITHUB_OUTPUT}"
          echo "count=$(python3 -c 'import json; print(len(json.load(open("matrix.json"))))')" >> "${GITHUB_OUTPUT}"

      - name: Job summary
        if: always()
        run: |
          python3 - >> "${GITHUB_STEP_SUMMARY}" <<'PY'
          import json
          from pathlib import Path
          print("### 🗺️ plan\n")
          if not Path("matrix.json").is_file():
              print("Planning failed; see the log.")
          elif not (jobs := json.load(open("matrix.json"))):
              print("Nothing to build: every package is already published.")
          else:
              print(f"{len(jobs)} packages to build, one job each:\n")
              print("| Package | Version | Architecture |\n| --- | --- | --- |")
              for job in jobs:
                  arch = "all" if job["file"].endswith("_all.deb") else job["arch"]
                  print(f"| `{job['package']}` | {job['version']} | {arch} |")
          PY

  build:
    name: build:${{ matrix.name }}:${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Download the published index
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            curl -fsSL --retry 5 --retry-all-errors -o Packages "${REPO_URL}/Packages"
          else
            : > Packages
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Builder image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/builder.Dockerfile
          tags: autonomy-packages-builder
          load: true
          cache-from: type=gha,scope=builder-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=builder-${{ matrix.arch }}
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"

      - name: Build ${{ matrix.package }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo autonomy-packages-builder \
            python3 tools/packages.py build --arch "${{ matrix.arch }}" --index Packages --out dist \
              --repo-url "${REPO_URL}" --only "${{ matrix.name }}"
          sudo chown -R "$(id -u):$(id -g)" dist
          test -f "dist/${{ matrix.file }}"

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.name }}-${{ matrix.arch }}
          path: dist/${{ matrix.file }}
          if-no-files-found: error

      - name: Job summary
        if: always()
        run: |
          {
            echo "### 📦 ${{ matrix.package }} ${{ matrix.version }} (${{ matrix.arch }})"
            echo
            if [ -f "dist/${{ matrix.file }}" ]; then
              echo "✅ Built \`${{ matrix.file }}\` ($(du -h "dist/${{ matrix.file }}" | cut -f1))."
              echo
              echo '```text'
              dpkg-deb --field "dist/${{ matrix.file }}" Depends
              echo '```'
            else
              echo "❌ Build failed; see the log."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  publish:
    name: publish
    needs: [plan, build]
    if: needs.build.result == 'success' && github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: packages-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true

      - id: new
        name: Anything to publish?
        run: |
          shopt -s nullglob
          aDebs=(dist/*.deb)
          echo "count=${#aDebs[@]}" >> "${GITHUB_OUTPUT}"

      - if: steps.new.outputs.count != '0'
        name: Index
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            curl -fsSL --retry 5 --retry-all-errors -o Packages "${REPO_URL}/Packages"
          else
            : > Packages
          fi
          python3 tools/packages.py index --index Packages --debs dist --out repo | tee index.json

      - if: steps.new.outputs.count != '0'
        name: Sign
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          install -d -m 700 "${GNUPGHOME}"
          gpg --batch --import <<< "${APT_SIGNING_KEY}"
          gpg --batch --yes --clearsign -o repo/InRelease repo/Release
          gpg --batch --yes --armor --detach-sign -o repo/Release.gpg repo/Release
          # The secret must match the committed public key that consumers trust.
          gpgv --keyring "${PWD}/keys/autonomy-archive-keyring.gpg" repo/InRelease
          cp keys/autonomy-archive-keyring.gpg repo/

      - if: steps.new.outputs.count != '0'
        name: Publish
        run: |
          if ! gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --latest=false \
              --title "apt repository" \
              --notes "Storage for the apt repository: every published package and its signed index. See the README for how to use it. Assets are only ever added; don't edit this release by hand."
          fi
          # Packages first, so the index never names a file that isn't there yet. Never clobber a published package.
          gh release upload "${RELEASE_TAG}" dist/*.deb --repo "${GITHUB_REPOSITORY}"
          gh release upload "${RELEASE_TAG}" repo/Packages repo/Packages.gz repo/Release repo/InRelease repo/Release.gpg \
            repo/autonomy-archive-keyring.gpg --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Job summary
        if: always()
        run: |
          {
            echo "### 🚀 publish"
            echo
            if [ "${{ steps.new.outputs.count }}" = "0" ]; then
              echo "Nothing new to publish."
            elif [ -f index.json ]; then
              python3 - <<'PY'
          import json
          report = json.load(open("index.json"))
          print("\n".join(f"- `{package}`" for package in report["added"]))
          print(f"\n{report['total']} packages in the repository.")
          PY
              echo
              echo "Repository: \`${REPO_URL}\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
